name: CPU checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential pkg-config libasound2-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,osc,video,vector]'
      - name: Install optional Vortex integration
        if: matrix.python == '3.13'
        run: python -m pip install 'sardine-system==0.4.0'
      - name: Record environment and check prerequisites
        run: |
          mkdir -p test-results
          python --version
          node --version
          ffmpeg -version
          ffprobe -version
          python -m pip freeze > test-results/packages.txt
          python -c 'import importlib.util; assert importlib.util.find_spec("moderngl") is None, "CPU job must not activate GL tests"'
      - name: Check Vortex is importable
        if: matrix.python == '3.13'
        run: python -c 'from sardine_core.sequences.tidal_parser import n, TimeSpan; assert n("0 1").query(TimeSpan(0, 1))'
      - name: Run CPU suite
        run: python -m pytest -q -ra --junitxml=test-results/pytest.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-python-${{ matrix.python }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
