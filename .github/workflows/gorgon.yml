name: Gorgon browser and VCV integration
on:
  push:
    paths: ['hydrapy/**', 'tests/test_studio*', 'tests/test_tracker*', '.github/workflows/gorgon.yml']
  pull_request:
    paths: ['hydrapy/**', 'tests/test_studio*', 'tests/test_tracker*', '.github/workflows/gorgon.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]' 'playwright==1.51.0'
      - run: python -m playwright install --with-deps chromium
      - name: Tracker and independent output windows in Chromium
        env:
          HYDRAPY_BROWSER_TESTS: '1'
        run: python -m pytest -q tests/test_tracker_editor.py tests/test_tracker_scheduler.py tests/test_studio_tracker_browser.py tests/test_studio_preview_browser.py
  vcv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JosiahAlanLee/DSP_Emulation
          ref: main
          path: .integration/DSP_Emulation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libjansson-dev
      - run: python -m pip install -e '.[test]'
      - name: Real Studio with the module on DSP_Emulation main
        run: |
          git -C .integration/DSP_Emulation rev-parse HEAD
          make -C .integration/DSP_Emulation/vcv/gorgon/tests e2e
