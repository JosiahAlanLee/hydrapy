name: Gorgon browser and VCV integration
on:
  push:
    paths: ['hydrapy/**', 'tests/test_studio*', 'tests/test_tracker*', '.github/workflows/gorgon.yml']
  pull_request:
    paths: ['hydrapy/**', 'tests/test_studio*', 'tests/test_tracker*', '.github/workflows/gorgon.yml']
  workflow_dispatch:
    inputs:
      gorgon_ref:
        description: 'Gorgon repository ref for the Rack module (default: main)'
        type: string
        required: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]' 'playwright==1.51.0'
      - run: python -m playwright install --with-deps chromium
      - name: Tracker and independent output windows in Chromium
        env:
          HYDRAPY_BROWSER_TESTS: '1'
        run: python -m pytest -q tests/test_tracker_editor.py tests/test_tracker_scheduler.py tests/test_studio_tracker_browser.py tests/test_studio_preview_browser.py
  vcv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JosiahAlanLee/Gorgon
          ref: ${{ inputs.gorgon_ref || 'main' }}
          path: .integration/Gorgon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libjansson-dev
      - run: python -m pip install -e '.[test]'
      - name: Real Studio with the current Rack module
        # Gorgon's main is always validated against a pinned HydraPy (its hydrapy.pin),
        # and contract changes land in HydraPy before rack/, so a failure here means
        # this change diverged from the contract. No pin on this side.
        run: |
          git -C .integration/Gorgon rev-parse HEAD
          make -C .integration/Gorgon/rack/tests e2e
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [jack, pipewire]
    env:
      XDG_RUNTIME_DIR: /tmp/gorgon-pipewire-runtime
      PIPEWIRE_LATENCY: 256/48000
      HYDRAPY_JACK_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jackd2 pipewire-bin pipewire-jack
      - run: python -m pip install -e '.[test,jack]'
      - name: JACK dummy server and real four-channel loopback
        if: matrix.backend == 'jack'
        run: |
          bash tests/start_audio_server.sh jack
          python -m pytest -q -s tests/test_studio_jack.py
      - name: PipeWire daemon and real JACK compatibility loopback
        if: matrix.backend == 'pipewire'
        run: |
          pw-jack bash tests/start_audio_server.sh pipewire
          pw-jack python -m pytest -q -s tests/test_studio_jack.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gorgon-${{ matrix.backend }}-logs
          path: /tmp/gorgon-*.log
