[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrapy"
version = "0.1.0"
description = "Hydra's video synth as a Python library: CPU + GPU backends, CV-style signals, feedback/reaction-diffusion ops, HTML/Hydra export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24", "pillow>=9", "imageio>=2.30"]

[project.optional-dependencies]
gpu = ["moderngl>=5.8"]
live = ["moderngl>=5.8", "glfw>=2.6"]
video = ["imageio-ffmpeg>=0.4"]
camera = ["opencv-python"]
cv = ["sounddevice>=0.4"]
osc = ["python-osc>=1.8"]
midi = ["mido>=1.3", "python-rtmidi"]
link = ["aalink"]
nca = ["torch"]
vector = ["scikit-image"]
virtualcam = ["pyvirtualcam"]
all = ["moderngl>=5.8", "glfw>=2.6", "imageio-ffmpeg>=0.4", "opencv-python", "sounddevice>=0.4", "python-osc>=1.8", "mido>=1.3", "python-rtmidi", "aalink", "scikit-image"]
test = ["pytest"]

[project.scripts]
hydrapy = "hydrapy.cli:main"

[tool.setuptools]
packages = ["hydrapy"]
include-package-data = false

[tool.setuptools.package-data]
hydrapy = ["studio.html", "tracker/*.html", "tracker/*.css", "tracker/*.js", "tracker/*.json"]
